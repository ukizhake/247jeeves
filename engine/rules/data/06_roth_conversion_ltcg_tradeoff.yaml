rule_name: roth_conversion_pushes_ltcg
title: Watch LTCG/QDI when doing Roth conversions
phase: early_retirement
source: "Richer Retirement #46 (Principle 3 caveat) / Larry example"
conditions:
  - phase_early_retirement
  - ltcg_tax_positive
actions:
